# Builds Tidelog as a static site and publishes it to GitHub Pages on every push to main.
# Site URL: https://<your-username>.github.io/<repo-name>/ (or your custom domain, if one is set in Settings > Pages)
#
# One-time setup (see README "Hosting on GitHub Pages"):
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   2. Firebase console > Authentication > Settings > Authorized domains: add the site's domain (tidelog.danhlee.ca)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Tells us whether the site is served at a sub-path (https://<user>.github.io/<repo>/) or a custom domain (/).
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npm run generate
        env:
          PAGES_BUILD: 'true'
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path }}/
          # Firebase web config is public by design (it ships in the site's JavaScript; security comes from
          # firestore.rules / storage.rules). Repository Variables override these defaults if you set them.
          NUXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NUXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyC6uU08CVLa2sfk9_EH2JCsj2aT7eJSKHo' }}
          NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'tidelog-1907d.firebaseapp.com' }}
          NUXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_PROJECT_ID || 'tidelog-1907d' }}
          NUXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_APP_ID || '1:487243448942:web:cea69e4d116bbc93845c7f' }}
          NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.NUXT_PUBLIC_FIREBASE_STORAGE_BUCKET || 'tidelog-1907d.firebasestorage.app' }}
          NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || '487243448942' }}
          NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ vars.NUXT_PUBLIC_FIREBASE_MEASUREMENT_ID || 'G-HC9HV0LWBX' }}

      # GitHub Pages runs Jekyll by default, which drops folders starting with "_" (Nuxt's /_nuxt/ bundle).
      - run: touch .output/public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
